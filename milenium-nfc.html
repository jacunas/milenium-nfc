<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Milenium E.I.R.L</title>
<style>
  :root {
    --brand: #173955;
    --bg: #f5f5f7;
    --card: rgba(255,255,255,0.75);
    --text: #1d1d1f;
    --sub: #6e6e73;
    --line: rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --card: rgba(28,28,30,0.75);
      --text: #f5f5f7;
      --sub: #a1a1a6;
      --line: rgba(255,255,255,0.09);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: max(env(safe-area-inset-top), 36px) 20px max(env(safe-area-inset-bottom), 32px);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(60% 40% at 15% 0%, rgba(23,57,85,0.20), transparent 70%),
      radial-gradient(50% 35% at 95% 8%, rgba(10,132,255,0.14), transparent 70%);
    background-repeat: no-repeat;
  }
  .wrap { max-width: 440px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 30px; animation: up .7s ease both; }
  .logo {
    width: 104px; height: 104px; border-radius: 26px; margin: 0 auto 20px;
    background: #fff;
    display: grid; place-items: center;
    box-shadow: 0 14px 34px rgba(23,57,85,0.22), 0 0 0 1px rgba(0,0,0,0.04);
  }
  .logo svg { width: 62px; height: auto; fill: var(--brand); }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; margin: 0 0 6px; }
  header p { margin: 0; color: var(--sub); font-size: 16px; }

  .group-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--sub); margin: 26px 8px 8px; font-weight: 600;
  }
  .group {
    background: var(--card);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    animation: up .7s ease both;
  }
  a.item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; text-decoration: none; color: inherit;
    transition: background .15s ease;
  }
  a.item + a.item { border-top: 1px solid var(--line); }
  a.item:active { background: rgba(120,120,128,0.16); }

  .icon {
    width: 44px; height: 44px; border-radius: 11px; flex: none;
    display: grid; place-items: center; color: #fff;
  }
  .icon svg { width: 24px; height: 24px; }
  .icon .fill { fill: currentColor; }
  .icon .stroke { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .web  { background: linear-gradient(145deg, #2a5d8a, #173955); }
  .wa   { background: linear-gradient(145deg, #30d158, #1fa842); }
  .maps { background: linear-gradient(145deg, #ff453a, #d70015); }
  .fb   { background: linear-gradient(145deg, #1877f2, #0b5ed7); }

  .txt { flex: 1; min-width: 0; }
  .txt strong { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .txt span { display: block; font-size: 14px; color: var(--sub); margin-top: 2px; }
  .chev { width: 8px; height: 14px; flex: none; opacity: .35; }

  footer { text-align: center; margin-top: 34px; font-size: 12px; color: var(--sub); }

  @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
